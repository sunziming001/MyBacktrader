# 零费用规则表——**测试夹具，不代表任何真实制度配置**。
#
# 用途：让「撮合机制」的测试（净值曲线、成交明细、真实数据冒烟）与「费用数值」的
# 测试分离。费用行为由 tests/test_costs.py 用 synthetic.toml 专门覆盖；
# 这里费用全零，机制测试的期望值因此仍可手算。
#
# 生效日期故意很早，好覆盖真实数据的完整历史区间。

schema_version = 1

