# ---------------------------------------------------------------------------
# 有意省略——以下规则在窗口内生效、且会实质影响能否成交/成交价/成本，但本表不建模。
# 完整清单与逐条说明见 docs/research/a-share-trading-rules.md §3。
# 分三类说明为何不建模：
#
# 【A. 会低估成本——**这类会造成偏乐观**，见 README 的风险清单】
#   - **证券结算风险基金**（十万分之三，双向，由结算参与人缴纳）：通常已计入券商成本，
#     不在投资者费用单出现。
#   - **大宗交易费率下浮**（沪深 A 股按标准费率下浮 30%）：本层不区分交易方式。
#
#   注：经手费与证管费**已建模**（见上），不在省略之列；它们是否叠加由
#   ``commission_mode`` 决定，故不构成静默低估。
#
# 【B. 需要本表拿不到的数据，无从判定故不猜（ADR-0005）】
#   - **新股上市初期无涨跌幅**（主板 2023-04-10 起前 5 日不设限；创业板/科创板前 5 日；
#     北交所首日）、**退市整理期首日不设限与整理期期限**：需要「上市日 / 退市整理期
#     起止」，本地 `.day` 不含。
#   - **优先股**（主板 10%、科创板 20%）、**存托凭证 CDR**（科创板 20%、过户费口径
#     不同）：需要品种标识，`.day` 不含。
#   - **印花税免征品种**（场内 ETF/LOF/可转债/公司债/国债逆回购）：按 ADR-0004 不进
#     股票池，由数据层剔除。
#
# 【C. 需要分时数据或账户状态，本层为日线级撮合】
#   - **有效申报价格范围（价格笼子）**、**盘中临时停牌**（较开盘价 ±30%/±60% 各停
#     10 分钟）、**收盘集合竞价**（14:57–15:00）、**盘后固定价格交易**（2026-07-06
#     起扩展至全部 A 股与 ETF）。
#   - **单笔申报数量**（主板 100 股整数倍；科创板限价≤10 万股等）。
#   - **风险警示股票单日买入上限**（沪深 ST 单账户当日累计≤50 万股）：需账户状态。
#   - **最小价格变动单位 0.01 元**下的**低价股绝对涨跌幅特例**：本表只按比例限幅，
#     未处理前收盘价极低时的绝对值规则。
#   - **融资融券标的与转融通**：影响做空/杠杆，本层不支持做空。
# ---------------------------------------------------------------------------
