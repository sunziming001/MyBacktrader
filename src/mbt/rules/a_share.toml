# 出厂交易制度规则表——每条数值都带出处，改动请连同出处一起改。
#
# 查表语义：给定 (键, 成交日)，取**生效日期 ≤ 成交日**中生效日期最大的一条；
# 变更日**当天**即生效。成交日早于该键最早的生效日期时**报错而不猜**（ADR-0005）。
#
# 数据窗口 2015-01-01 ~ 2026-09-11。整理过程、逐条出处与不确定项见
# docs/research/a-share-trading-rules.md。
#
# 单位：比例一律写成小数（0.10 = 10%，0.0005 = 万分之五）。

schema_version = 1

# ---------------------------------------------------------------------------
# 涨跌幅限制 · 日常
# 出处：沪/深主板 10% 自 1996-12-16（新华社）；创业板 2009-10-30 开板 10%、
# 2020-08-24 注册制改革起 20%（中证网）；科创板 2019-07-22 起 20%；
# 北交所 2021-11-15 起 30%（前身为 2020-07-27 新三板精选层）。
#
# 中小板（深市 002/003 段）自 2004-06-25 开板至 2021-04-06 并入主板，
# 日常涨跌幅**始终 10%**、与主板一致，故无需单列——并入深主板即可。
# ---------------------------------------------------------------------------

[[price_limit]]
board = "沪主板"
effective_from = 1996-12-16
limit = 0.10

[[price_limit]]
board = "深主板"
effective_from = 1996-12-16
limit = 0.10

[[price_limit]]
board = "创业板"
effective_from = 2009-10-30
limit = 0.10

# 注册制改革：创业板存量股票与新股一并由 10% 改为 20%
[[price_limit]]
board = "创业板"
effective_from = 2020-08-24
limit = 0.20

[[price_limit]]
board = "科创板"
effective_from = 2019-07-22
limit = 0.20

[[price_limit]]
board = "北交所"
effective_from = 2021-11-15
limit = 0.30

# ---------------------------------------------------------------------------
# 涨跌幅限制 · 新股上市初期**不设涨跌幅**的交易日数
#
# 出处、逐条来源与不确定项见 docs/research/a-share-trading-rules.md 1.3。该节原注
# 「本票据明确不建模，仅登记」；自 ADR-0013 起按此表建模，用途是**行情质检豁免**
# （``mbt.data.anomaly``）——上市初期没有涨跌幅，那些「越界跳空」是制度空窗而非坏数据。
#
# 查表语义与别处**不同**，两处都要注意：
#   1. 键是（板块, **上市日**），不是成交日；
#   2. **查不到适用条目表示「不豁免」（0 天），不是报错**——这里「没有条目」是
#      「该上市日没有这条制度」这个事实本身，而不是「我们不知道」（另见
#      ``RuleTable.new_listing_no_limit_days`` 的说明）。
#
# 新三板精选层（2020-07-27 起「成交首日不设涨跌幅」）未单列：``board_of`` 把
# 430/83x 段归入北交所，而北交所那一条的生效日 2021-11-15 晚于它，故那段历史回退到
# 「不豁免」——那是**更严**的一侧，且首日本就不在质检范围内（见 ``find_anomalies``）。
# ---------------------------------------------------------------------------

[[new_listing_no_limit]]
board = "科创板"
effective_from = 2019-07-22
days = 5

[[new_listing_no_limit]]
board = "创业板"
effective_from = 2020-08-24
days = 5

# 全面注册制首批主板新股于 2023-04-10 上市，故主板旧制的适用区间到 2023-04-09 为止。
[[new_listing_no_limit]]
board = "沪主板"
effective_from = 2023-04-10
days = 5

[[new_listing_no_limit]]
board = "深主板"
effective_from = 2023-04-10
days = 5

[[new_listing_no_limit]]
board = "北交所"
effective_from = 2021-11-15
days = 1

# ---------------------------------------------------------------------------
# 涨跌幅限制 · 风险警示股 ST / *ST
#
# 「ST 股 5%」只对**沪深主板**成立，且有两个必须按日期区分的例外：
#   1. 创业板 ST 在 2020-08-24 之前是 5%，改革起随板块跳到 20%；
#   2. 主板 ST 的 5% 自 2026-07-06 起**上调为 10%**（沪深交易所 2026 年修订）。
# 科创板自开板起即板块统一 20%，未对 ST 作例外；北交所 ST 同为 30%。
# 出处见 docs/research/a-share-trading-rules.md §1.2。
#
# ⚠️ 本节的 ST 限幅**目前选不中**：`limit_for` 只有在 `[[st_period]]` 登记了该
# 标的在该日处于 ST 时才会取用本节的数值，而本地数据不含股票名称，无法回溯历史
# ST 状态（见 tdx-halt-and-limit-representation.md 的未决风险）。故出厂表**不登记
# 任何 st_period**，一律按非 ST 取值——这是宁漏不错的取舍：漏登记会让限幅偏大
# （放过本不该成交的交易），而不是凭空造出停牌。ST 期间数据源到位后，本节即生效。
# ---------------------------------------------------------------------------

[[st_price_limit]]
board = "沪主板"
effective_from = 1998-04-28
limit = 0.05

[[st_price_limit]]
board = "沪主板"
effective_from = 2026-07-06
limit = 0.10

[[st_price_limit]]
board = "深主板"
effective_from = 1998-04-28
limit = 0.05

[[st_price_limit]]
board = "深主板"
effective_from = 2026-07-06
limit = 0.10

# 创业板 ST：改革前 5%，改革起随板块 20%（深交所《创业板交易特别规定》）
[[st_price_limit]]
board = "创业板"
effective_from = 2009-10-30
limit = 0.05

[[st_price_limit]]
board = "创业板"
effective_from = 2020-08-24
limit = 0.20

# 科创板 ST 与板块一致（《科创板股票交易特别规定》第十六条对全部竞价交易统一
# 20%，未列 ST 例外）。⚠️ 中等置信度：「ST 同样 20%」来自券商/基金投教材料而非
# 交易所专门条文。若实际更严，相关个股的涨跌停一字可能被误判为可成交。
[[st_price_limit]]
board = "科创板"
effective_from = 2019-07-22
limit = 0.20

[[st_price_limit]]
board = "北交所"
effective_from = 2021-11-15
