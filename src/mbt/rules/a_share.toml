# 出厂交易制度规则表——每条数值都带出处，改动请连同出处一起改。
#
# 查表语义：给定 (键, 成交日)，取**生效日期 ≤ 成交日**中生效日期最大的一条；
# 变更日**当天**即生效。成交日早于该键最早的生效日期时**报错而不猜**（ADR-0005）。
#
# 数据窗口 2015-01-01 ~ 2026-09-11。整理过程、逐条出处与不确定项见
# docs/research/a-share-trading-rules.md。
#
# 单位：比例一律写成小数（0.10 = 10%，0.0005 = 万分之五）。

schema_version = 1

# ---------------------------------------------------------------------------
# 涨跌幅限制 · 日常
# 出处：沪/深主板 10% 自 1996-12-16（新华社）；创业板 2009-10-30 开板 10%、
# 2020-08-24 注册制改革起 20%（中证网）；科创板 2019-07-22 起 20%；
# 北交所 2021-11-15 起 30%（前身为 2020-07-27 新三板精选层）。
#
# 中小板（深市 002/003 段）自 2004-06-25 开板至 2021-04-06 并入主板，
# 日常涨跌幅**始终 10%**、与主板一致，故无需单列——并入深主板即可。
# ---------------------------------------------------------------------------

[[price_limit]]
board = "沪主板"
effective_from = 1996-12-16
limit = 0.10

[[price_limit]]
board = "深主板"
effective_from = 1996-12-16
limit = 0.10

[[price_limit]]
board = "创业板"
effective_from = 2009-10-30
limit = 0.10

# 注册制改革：创业板存量股票与新股一并由 10% 改为 20%
[[price_limit]]
board = "创业板"
effective_from = 2020-08-24
limit = 0.20

[[price_limit]]
board = "科创板"
effective_from = 2019-07-22
limit = 0.20

[[price_limit]]
board = "北交所"
effective_from = 2021-11-15
limit = 0.30

# ---------------------------------------------------------------------------
# 涨跌幅限制 · 风险警示股 ST / *ST
#
# 「ST 股 5%」只对**沪深主板**成立，且有两个必须按日期区分的例外：
#   1. 创业板 ST 在 2020-08-24 之前是 5%，改革起随板块跳到 20%；
#   2. 主板 ST 的 5% 自 2026-07-06 起**上调为 10%**（沪深交易所 2026 年修订）。
# 科创板自开板起即板块统一 20%，未对 ST 作例外；北交所 ST 同为 30%。
# 出处见 docs/research/a-share-trading-rules.md §1.2。
#
# ⚠️ 本节的 ST 限幅**目前选不中**：`limit_for` 只有在 `[[st_period]]` 登记了该
# 标的在该日处于 ST 时才会取用本节的数值，而本地数据不含股票名称，无法回溯历史
# ST 状态（见 tdx-halt-and-limit-representation.md 的未决风险）。故出厂表**不登记
# 任何 st_period**，一律按非 ST 取值——这是宁漏不错的取舍：漏登记会让限幅偏大
# （放过本不该成交的交易），而不是凭空造出停牌。ST 期间数据源到位后，本节即生效。
# ---------------------------------------------------------------------------

[[st_price_limit]]
board = "沪主板"
effective_from = 1998-04-28
limit = 0.05

[[st_price_limit]]
board = "沪主板"
effective_from = 2026-07-06
limit = 0.10

[[st_price_limit]]
board = "深主板"
effective_from = 1998-04-28
limit = 0.05

[[st_price_limit]]
board = "深主板"
effective_from = 2026-07-06
limit = 0.10

# 创业板 ST：改革前 5%，改革起随板块 20%（深交所《创业板交易特别规定》）
[[st_price_limit]]
board = "创业板"
effective_from = 2009-10-30
limit = 0.05

[[st_price_limit]]
board = "创业板"
effective_from = 2020-08-24
limit = 0.20

# 科创板 ST 与板块一致（《科创板股票交易特别规定》未对 ST 作例外）
[[st_price_limit]]
board = "科创板"
effective_from = 2019-07-22
limit = 0.20

[[st_price_limit]]
board = "北交所"
effective_from = 2021-11-15
limit = 0.30

# ---------------------------------------------------------------------------
# 印花税——**仅卖出方**单边，按成交金额计。全板块同率（北交所亦不豁免）。
# 出处：财税明电〔2008〕2 号（0.1% 单边）；财政部 税务总局公告 2023 年第 39 号
# （自 2023-08-28 起减半为 0.05%）。
#
# 未列出 2022-07-01「印花税法施行」一条：该日**税率不变**（把长期执行的 0.1%
# 上升为法律），不构成一次费率变更，列进来只会制造一条假变更。
# ---------------------------------------------------------------------------

[[stamp_duty]]
effective_from = 2008-09-19
sell_rate = 0.001

[[stamp_duty]]
effective_from = 2023-08-28
sell_rate = 0.0005

# ---------------------------------------------------------------------------
# 过户费——按**市场**收取，故沪市的科创板与深市的创业板各按其市场填列。
# 全部为**买卖双向**、按**成交金额**计。出处：中国结算 2015-08-01 调整通知、
# 2022-04-29 降费通知（转载：人民网、中国产业经济信息网）。
#
# ⚠️ 两处必须说明：
#
# 1. **沪主板在 2015-08-01 之前没有条目，查表会报错**，这是刻意的。那时沪市按
#    **成交面额**（0.3‰ × 每股面值 × 股数）计费，而本实现按成交金额计费。
#    面额需要**每股面值**，而 `.day` 数据不含它，且它**不恒为 1 元**（如紫金矿业
#    为 0.1 元）。凭「面值 = 1 元」硬算会给这类股票算错，故宁可报错让人看见缺口。
# 2. 「2022-04-29 起沪深统一为双向收取」这一既有表述**不准确**：沪深在此之前
#    **本就双向收取**，该日的真实变化是费率 0.02‰ → 0.01‰（北交所 0.025‰ → 0.01‰）
#    的**降费**。本表按实情填列。
#
# 创业板早于 2012-06-01 的深市费率无法从一手公告精确定位，且远早于本表窗口
# （2015-01-01），故深市系列的起点取有据可查的 2012-06-01。
# ---------------------------------------------------------------------------

[[transfer_fee]]
board = "沪主板"
effective_from = 2015-08-01
rate = 0.00002
sides = "both"

[[transfer_fee]]
board = "沪主板"
effective_from = 2022-04-29
rate = 0.00001
sides = "both"

[[transfer_fee]]
board = "深主板"
effective_from = 2012-06-01
rate = 0.0000255
sides = "both"

[[transfer_fee]]
board = "深主板"
effective_from = 2015-08-01
rate = 0.00002
sides = "both"

[[transfer_fee]]
board = "深主板"
effective_from = 2022-04-29
rate = 0.00001
sides = "both"

# 创业板属深市，费率与深市一致
[[transfer_fee]]
board = "创业板"
effective_from = 2012-06-01
rate = 0.0000255
sides = "both"

[[transfer_fee]]
board = "创业板"
effective_from = 2015-08-01
rate = 0.00002
sides = "both"

[[transfer_fee]]
board = "创业板"
effective_from = 2022-04-29
rate = 0.00001
sides = "both"

# 科创板属沪市，2019-07-22 开板时的沪市费率即 0.02‰
[[transfer_fee]]
board = "科创板"
effective_from = 2019-07-22
rate = 0.00002
sides = "both"

[[transfer_fee]]
board = "科创板"
effective_from = 2022-04-29
rate = 0.00001
sides = "both"

[[transfer_fee]]
board = "北交所"
effective_from = 2021-11-15
rate = 0.000025
sides = "both"

[[transfer_fee]]
board = "北交所"
effective_from = 2022-04-29
rate = 0.00001
sides = "both"

# ---------------------------------------------------------------------------
# 有意省略（会在实质影响成交/成本，但不建模；ADR-0002 范围内已逐条确认）
#
# - **佣金**是券商与客户协商的市场化费率，不是制度，故为 run_backtest 的参数。
# - **经手费、证管费、证券结算风险基金**：券商多以「全佣」一并收取，若本表另立
#   条目会与佣金**重复计费**。故不建模；用「净佣」口径者需自行把规费计入佣金。
# - **新股上市初期无涨跌幅**（主板 2023-04-10 起前 5 日不设限、创业板/科创板前 5 日、
#   北交所首日）、**退市整理期首日不设限**：需要「上市日 / 退市整理期起止」数据，
#   本地 `.day` 不含。缺该数据就无从判定，故不建模。
# - **盘中临时停牌、有效申报价格范围（价格笼子）、收盘集合竞价、盘后固定价格交易、
#   单笔申报数量、ST 单日买入上限**：均影响撮合可行性，但需分时数据或账户状态，
#   本层为日线级撮合，不建模。
# - **可转债 / ETF / 基金 / 存托凭证**：按 ADR-0004 不进股票池，由数据层剔除；
#   它们不受本表的股票制度约束。
# ---------------------------------------------------------------------------
